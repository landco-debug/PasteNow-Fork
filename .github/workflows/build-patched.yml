name: Build PasteNow 2.32 MultiPaste Helper

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-patched.yml'
      - 'helper/**'
      - 'tools/build_helper.sh'
      - 'AGENTS.md'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build companion helper
        run: bash tools/build_helper.sh dist

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: PasteNow-MultiPaste-Helper-0.2
          path: |
            dist/PasteNow-MultiPaste-Helper-0.2.zip
            dist/PasteNow-MultiPaste-Helper-0.2.zip.sha256
            dist/INSTALL-AND-TEST.txt
          if-no-files-found: error
          retention-days: 14
